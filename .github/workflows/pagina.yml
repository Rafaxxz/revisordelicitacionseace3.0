name: Publicar página web
on:
  push:
    branches: [claude/stoic-edison-bldhb4]
    paths: ["web/**", ".github/workflows/pagina.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pagina
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar web/ a la rama gh-pages
        run: |
          set -e
          cp -r web /tmp/sitio
          touch /tmp/sitio/.nojekyll
          cd /tmp/sitio
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar página ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
