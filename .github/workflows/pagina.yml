name: Revisión diaria y página web
on:
  schedule:
    - cron: "17 11 * * *"   # 06:17 hora de Lima, todos los días
  push:
    branches: [claude/stoic-edison-bldhb4]
    paths: ["web/**", "revisor/**", ".github/workflows/pagina.yml"]
  workflow_dispatch:
    inputs:
      dias:
        description: "Días hacia atrás para buscar ganadores"
        default: "365"
permissions:
  contents: write
concurrency:
  group: pagina
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Revisar SEACE y DIGESA
        id: revision
        continue-on-error: true
        run: python -m revisor.publicar --salida /tmp/sitio/datos --dias "${{ github.event.inputs.dias || '365' }}"
      - name: Conservar los datos anteriores si la revisión falló
        if: steps.revision.outcome != 'success'
        run: |
          mkdir -p /tmp/sitio/datos
          git fetch -q origin gh-pages && git show origin/gh-pages:datos/ultimo.json > /tmp/sitio/datos/ultimo.json 2>/dev/null || true
          git show origin/gh-pages:datos/reporte.pdf > /tmp/sitio/datos/reporte.pdf 2>/dev/null || true
      - name: Publicar en la rama gh-pages
        run: |
          set -e
          cp -r web/. /tmp/sitio/
          touch /tmp/sitio/.nojekyll
          cd /tmp/sitio
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Revisión $(TZ=America/Lima date '+%Y-%m-%d %H:%M')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
